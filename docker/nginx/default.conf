# Upstream PHP-FPM with persistent keepalive connections
upstream php_backend {
    server ticketing_app:9000;
    keepalive 16;
}

# Rate limit zone: 5 requests per minute per IP for POST /tiket
limit_req_zone $binary_remote_addr zone=post_ticket_limit:10m rate=5r/m;
limit_req_status 429;

# ==============================================================================
# 1. Server Block: Pengalihan Otomatis HTTP (Port 80) ke HTTPS (Port 443)
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ticketing.cirebonkota.go.id localhost 127.0.0.1;
    server_tokens off;

    # 301 Permanent Redirect ke HTTPS
    return 301 https://$host$request_uri;
}

# ==============================================================================
# 2. Server Block: Portal Publik ASN (ticketing.cirebonkota.go.id & localhost)
# Melayani HTTPS (Port 443)
# ==============================================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ticketing.cirebonkota.go.id localhost 127.0.0.1;
    server_tokens off;
    root /var/www/html/public;
    index index.php index.html;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # OWASP & Gov-CSIRT Security Headers Lengkap
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; frame-src 'self' https://www.google.com https://recaptcha.google.com; connect-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Blokir akses langsung ke folder /storage/
    location ^~ /storage/ {
        deny all;
        return 403;
    }

    # Isolasi Port Jaringan:
    # Blokir akses /login dan /admin/* di Port Publik (Port 80 & 443).
    # Akses administratif HANYA diizinkan melalui Port 8443 HTTPS.
    location ~ ^/(login|admin) {
        return 404;
    }

    # Rate limiting khusus untuk submit tiket (POST /tiket)
    location = /tiket {
        limit_except POST {
            # GET /tiket diteruskan normal tanpa rate limit
        }
        limit_req zone=post_ticket_limit burst=2 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching Optimization
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Penanganan route utama
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_backend;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
    }

    # Sembunyikan file dotfiles (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ==============================================================================
# 3. Server Block: Portal Internal Petugas (admin-ticketing.cirebonkota.go.id)
