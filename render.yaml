services:
  - type: web
    name: sistem-ticketing
    runtime: docker
    dockerfilePath: Dockerfile.render
    plan: free
    region: singapore
    branch: main
    envVars:
      - key: APP_NAME
        value: Sistem Ticketing DKIS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ticketing-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ticketing-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ticketing-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ticketing-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ticketing-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: ticketing-db
    databaseName: ticketing_dkis
    user: postgres
    plan: free
    region: singapore

